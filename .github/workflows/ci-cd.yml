# RentDirect API — continuous integration and deployment
# Docs: docs/CI_CD.md

name: Backend CI/CD

on:
  push:
    branches: [main, master, develop, feature-fix]
  pull_request:
    branches: [main, master, develop, feature-fix]
  workflow_dispatch:
    inputs:
      run_deploy:
        description: Deploy to Vercel production (requires secrets)
        type: boolean
        default: false

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  PIP_CACHE_DIR: ~/.cache/pip
  CI_SECRET_KEY: ci-secret-key-for-github-actions-only-32chars
  CI_DATABASE_URL: sqlite:///./ci_test.db

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q app api

      - name: Import smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
          ENVIRONMENT: test
          SECRET_KEY: ${{ env.CI_SECRET_KEY }}
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          SKIP_STARTUP_MIGRATIONS: "true"
        run: python -c "from app.main import app; assert app.title"

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
          ENVIRONMENT: test
          SECRET_KEY: ${{ env.CI_SECRET_KEY }}
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          SKIP_STARTUP_MIGRATIONS: "true"
          PAYMENT_ALLOW_MOCK: "true"
          PAYMENT_GATEWAY_PROVIDER: mock
        run: python -m pytest tests --tb=short -q --junitxml=test-results.xml

      - name: Publish test summary
        if: always()
        run: |
          if [ -f test-results.xml ]; then
            echo "## Test results" >> "$GITHUB_STEP_SUMMARY"
            echo "JUnit report: \`test-results.xml\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml
          retention-days: 14
          if-no-files-found: ignore

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit dependencies (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --desc on

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mrm-rental-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.run_deploy == true) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    timeout-minutes: 20
    environment:
      name: production
      url: https://mrm-rental-manager-backend.vercel.app
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Vercel credentials
        id: vercel_ready
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel deploy skipped. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID repo secrets, or rely on Vercel Git integration."
            echo "## Deployment" >> "$GITHUB_STEP_SUMMARY"
            echo "Vercel secrets are not set. Production deploys may still run via the **Vercel ↔ GitHub** integration on push to \`main\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to Vercel
        id: deploy
        if: steps.vercel_ready.outputs.ready == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./

      - name: Post-deploy health check
        if: steps.vercel_ready.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "https://mrm-rental-manager-backend.vercel.app/api/v1/platform/readiness" -o /tmp/readiness.json; then
              echo "Readiness response:" && cat /tmp/readiness.json
              exit 0
            fi
            echo "Waiting for deployment… ($i/5)"
            sleep 15
          done
          echo "::warning::Readiness endpoint did not respond in time (non-fatal)."
