name: Backend CI

on:
  push:
    branches: [main, master, feature-fix, develop]
  pull_request:
    branches: [main, master, feature-fix, develop]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & smoke import
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key-for-github-actions-only-32chars
          DATABASE_URL: sqlite:///./ci_test.db
          SKIP_STARTUP_MIGRATIONS: "true"
          PAYMENT_ALLOW_MOCK: "true"
          PAYMENT_GATEWAY_PROVIDER: mock
        run: pytest tests -q

      - name: Verify app imports
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secret-key-for-github-actions-only-32chars
          DATABASE_URL: sqlite:///./ci_test.db
          SKIP_STARTUP_MIGRATIONS: "true"
        run: python -c "from app.main import app; assert app.title"
